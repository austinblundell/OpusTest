name: Deploy to GitHub Pages

# Publishes the static game (repo root) to GitHub Pages.
# One-time setup: in the repo Settings → Pages, set "Source" to "GitHub Actions".
# After that, every push to main (or this feature branch) redeploys automatically
# to https://austinblundell.github.io/OpusTest/

on:
  push:
    branches:
      - main
      - claude/final-fantasy-browser-game-0quby7
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the whole repository root (index.html, css/, js/)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
